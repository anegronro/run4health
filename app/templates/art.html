{# Original cover artwork. No external assets: every program gets a drawing
   built from its own accent colour, so the app looks finished offline. #}

{% macro cover(kind, uid) %}
<svg class="art" viewBox="0 0 400 160" preserveAspectRatio="xMidYMid slice"
     aria-hidden="true" focusable="false">
  <defs>
    <linearGradient id="wash-{{ uid }}" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="var(--accent)" stop-opacity=".40"/>
      <stop offset="1" stop-color="var(--accent)" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="400" height="160" fill="url(#wash-{{ uid }})"/>
  {% if kind == "track" %}
    {# Stadium lanes seen from above. #}
    <g fill="none" stroke="var(--accent)" stroke-opacity=".30" stroke-width="2">
      <rect x="70" y="34" width="260" height="92" rx="46"/>
      <rect x="56" y="22" width="288" height="116" rx="58"/>
      <rect x="42" y="10" width="316" height="140" rx="70"/>
    </g>
    <rect x="84" y="46" width="232" height="68" rx="34" fill="none"
          stroke="var(--accent)" stroke-width="3.5" stroke-opacity=".9"
          stroke-dasharray="6 10" stroke-linecap="round"/>
    <circle cx="200" cy="46" r="5.5" fill="var(--accent)"/>
  {% elif kind == "weights" %}
    {# Barbell: bar, sleeves and plates. #}
    <g stroke="var(--accent)" stroke-opacity=".28" stroke-width="1.5" fill="none">
      <path d="M0 118 H400"/><path d="M0 132 H400"/>
    </g>
    <rect x="96" y="76" width="208" height="7" rx="3.5" fill="var(--accent)" opacity=".85"/>
    <g fill="var(--accent)">
      <rect x="110" y="58" width="12" height="43" rx="5" opacity=".55"/>
      <rect x="126" y="46" width="16" height="67" rx="7"/>
      <rect x="258" y="46" width="16" height="67" rx="7"/>
      <rect x="278" y="58" width="12" height="43" rx="5" opacity=".55"/>
    </g>
  {% else %}
    {# Route over contour lines: start bottom-left, finish top-right. #}
    <g fill="none" stroke="var(--accent)" stroke-opacity=".20" stroke-width="1.5">
      <path d="M-20 142 C 60 112, 130 158, 200 126 S 340 84, 420 116"/>
      <path d="M-20 116 C 70 86, 130 130, 210 96 S 340 56, 420 88"/>
      <path d="M-20 88 C 80 60, 140 100, 220 66 S 340 28, 420 58"/>
    </g>
    <path d="M28 126 C 96 126, 84 68, 152 70 S 246 114, 296 78 S 356 54, 384 58"
          fill="none" stroke="var(--accent)" stroke-width="3.5"
          stroke-linecap="round" stroke-dasharray="1 11"/>
    <circle cx="28" cy="126" r="6.5" fill="var(--accent)"/>
    <g transform="translate(384 58)">
      <circle r="6.5" fill="var(--accent)"/>
      <path d="M0 -6 V -23 L 14 -18.5 L 0 -14" fill="var(--accent)" opacity=".8"/>
    </g>
  {% endif %}
</svg>
{% endmacro %}
