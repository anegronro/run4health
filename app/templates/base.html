<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e0f13">
<title>{% block title %}Programs{% endblock %}</title>
<style>{{ asset("style.css") | safe }}</style>
{% block head_extra %}{% endblock %}
</head>
<body class="{% block body_class %}{% endblock %}">
<header class="bar">
  {% block back %}{% endblock %}
  <span class="brand">Programs</span>
  {% if me %}
    <a class="me" href="/me"
       style="--accent: {{ me.color }}" title="Your training log">
      <span class="me-dot">{{ me.name[:1] | upper }}</span>
      <span class="me-name">{{ me.name }}</span>
    </a>
  {% endif %}
</header>
<main{% block body_style %}{% endblock %}>{% block content %}{% endblock %}</main>
</body>
</html>
